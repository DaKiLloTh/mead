<!-- mead-mon's menu bar glyph when updates are available: the same mug,
     filled, with an exclamation mark cut out of it. Render with:
     rsvg-convert -w 32 -h 32 mead-mon-template-alert.svg -o mead-mon-template-alert.png -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32">
  <defs>
    <mask id="bang">
      <rect width="16" height="16" fill="#fff"/>
      <rect x="5.95" y="4.5" width="1.6" height="5.5" rx="0.8" fill="#000"/>
      <circle cx="6.75" cy="12" r="0.95" fill="#000"/>
    </mask>
  </defs>
  <rect x="1.5" y="1.5" width="10.5" height="13.5" rx="2.25" fill="#000" mask="url(#bang)"/>
  <path d="M11.25 5.5 C15 5.5 15 11.25 11.25 11.25" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
</svg>
