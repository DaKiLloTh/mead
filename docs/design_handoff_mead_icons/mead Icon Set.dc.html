<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #B8823A; }
    a:hover { color: #8B5E3C; }
  </style>
</helmet>

<div style="min-height:100vh; background:{{bgPage}}; color:{{textPrimary}}; font-family:'Manrope',sans-serif; padding:56px 64px 80px; transition:background .3s,color .3s;">

  <div style="display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:56px; flex-wrap:wrap; gap:24px;">
    <div>
      <div style="font-family:'Instrument Serif',serif; font-style:italic; font-size:56px; line-height:1; letter-spacing:-0.5px;">mead</div>
      <div style="font-size:13px; letter-spacing:1.5px; text-transform:uppercase; color:{{textSecondary}}; margin-top:10px; font-weight:600;">icon set — gui package manager</div>
    </div>
    <div style="display:flex; gap:4px; background:{{bgCard}}; border:1px solid {{border}}; border-radius:12px; padding:4px;">
      <button onClick="{{setLight}}" style="border:none; background:{{lightBtnBg}}; color:{{lightBtnText}}; font-family:'Manrope',sans-serif; font-weight:600; font-size:13px; padding:8px 16px; border-radius:8px; cursor:pointer;">Light</button>
      <button onClick="{{setDark}}" style="border:none; background:{{darkBtnBg}}; color:{{darkBtnText}}; font-family:'Manrope',sans-serif; font-weight:600; font-size:13px; padding:8px 16px; border-radius:8px; cursor:pointer;">Dark</button>
    </div>
  </div>

  <!-- APP ICON -->
  <div style="margin-bottom:52px;">
    <div style="font-size:12px; letter-spacing:1.2px; text-transform:uppercase; color:{{textSecondary}}; font-weight:700; margin-bottom:16px;">App Icon</div>
    <div style="display:flex; align-items:center; gap:36px; flex-wrap:wrap; background:{{bgCard}}; border:1px solid {{border}}; border-radius:20px; padding:32px;">
      <svg viewBox="0 0 100 100" width="128" height="128" style="filter:drop-shadow(0 10px 24px rgba(0,0,0,0.18));">
        <defs>
          <linearGradient id="appGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="{{accent}}"/>
            <stop offset="1" stop-color="{{accentDark}}"/>
          </linearGradient>
        </defs>
        <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#appGrad)"/>
        <polygon points="16,76 21,73 21,79 16,82" fill="{{accentSoft}}" opacity="0.28"/>
        <rect x="34" y="30" width="28" height="42" rx="5" fill="{{accentSoft}}" stroke="{{accentDarker}}" stroke-width="2.5"/>
        <path d="M62 40 C79 40 79 61 62 61" fill="none" stroke="{{accentDarker}}" stroke-width="3.5" stroke-linecap="round"/>
        <rect x="36.5" y="41" width="23" height="28.5" rx="3" fill="{{accentDark}}"/>
        <ellipse cx="48" cy="41" rx="12.5" ry="4" fill="{{accentSoft}}" opacity="0.95"/>
        <circle cx="43" cy="55" r="1.5" fill="{{accentSoft}}" opacity="0.6"/>
        <circle cx="52" cy="61" r="1.2" fill="{{accentSoft}}" opacity="0.5"/>
      </svg>
      <div style="display:flex; align-items:flex-end; gap:22px;">
        <div style="text-align:center;">
          <svg viewBox="0 0 100 100" width="64" height="64"><rect x="2" y="2" width="96" height="96" rx="22" fill="url(#appGrad)"/><rect x="34" y="30" width="28" height="42" rx="5" fill="{{accentSoft}}" stroke="{{accentDarker}}" stroke-width="2.5"/><path d="M62 40 C79 40 79 61 62 61" fill="none" stroke="{{accentDarker}}" stroke-width="3.5" stroke-linecap="round"/><rect x="36.5" y="41" width="23" height="28.5" rx="3" fill="{{accentDark}}"/><ellipse cx="48" cy="41" rx="12.5" ry="4" fill="{{accentSoft}}" opacity="0.95"/></svg>
          <div style="font-size:11px; color:{{textSecondary}}; margin-top:8px;">64px</div>
        </div>
        <div style="text-align:center;">
          <svg viewBox="0 0 100 100" width="36" height="36"><rect x="2" y="2" width="96" height="96" rx="22" fill="url(#appGrad)"/><rect x="34" y="30" width="28" height="42" rx="5" fill="{{accentSoft}}" stroke="{{accentDarker}}" stroke-width="2.5"/><path d="M62 40 C79 40 79 61 62 61" fill="none" stroke="{{accentDarker}}" stroke-width="3.5" stroke-linecap="round"/><rect x="36.5" y="41" width="23" height="28.5" rx="3" fill="{{accentDark}}"/></svg>
          <div style="font-size:11px; color:{{textSecondary}}; margin-top:8px;">32px</div>
        </div>
        <div style="text-align:center;">
          <svg viewBox="0 0 100 100" width="20" height="20"><rect x="2" y="2" width="96" height="96" rx="22" fill="url(#appGrad)"/><rect x="34" y="30" width="28" height="42" rx="5" fill="{{accentSoft}}"/></svg>
          <div style="font-size:11px; color:{{textSecondary}}; margin-top:8px;">16px</div>
        </div>
      </div>
    </div>
  </div>

  <!-- TOOLBAR -->
  <div style="margin-bottom:52px;">
    <div style="font-size:12px; letter-spacing:1.2px; text-transform:uppercase; color:{{textSecondary}}; font-weight:700; margin-bottom:16px;">Toolbar Actions</div>
    <div style="display:flex; gap:20px; flex-wrap:wrap;">

      <div style="text-align:center;">
        <div style="width:56px; height:56px; border-radius:14px; background:{{bgCard}}; border:1px solid {{border}}; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 2px rgba(0,0,0,0.04);">
          <svg viewBox="0 0 32 32" width="26" height="26" fill="none">
            <path d="M16 5 V20" stroke="{{accent}}" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M10 15 L16 21 L22 15" stroke="{{accent}}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M6 25 H26" stroke="{{accent}}" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div style="font-size:12px; color:{{textSecondary}}; margin-top:8px;">Install</div>
      </div>

      <div style="text-align:center;">
        <div style="width:56px; height:56px; border-radius:14px; background:{{bgCard}}; border:1px solid {{border}}; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 2px rgba(0,0,0,0.04);">
          <svg viewBox="0 0 32 32" width="26" height="26" fill="none">
            <circle cx="16" cy="16" r="11" stroke="{{accent}}" stroke-width="2.2"/>
            <path d="M16 21 V11" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M11 15 L16 10 L21 15" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div style="font-size:12px; color:{{textSecondary}}; margin-top:8px;">Update</div>
      </div>

      <div style="text-align:center;">
        <div style="width:56px; height:56px; border-radius:14px; background:{{bgCard}}; border:1px solid {{border}}; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 2px rgba(0,0,0,0.04);">
          <svg viewBox="0 0 32 32" width="26" height="26" fill="none">
            <path d="M9 11 H23" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M12 11 V8.5 C12 7.7 12.7 7 13.5 7 H18.5 C19.3 7 20 7.7 20 8.5 V11" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M11 11 L12 24 C12 24.8 12.7 25.5 13.5 25.5 H18.5 C19.3 25.5 20 24.8 20 24 L21 11" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14.5 15 V21" stroke="{{accent}}" stroke-width="2" stroke-linecap="round"/>
            <path d="M17.5 15 V21" stroke="{{accent}}" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div style="font-size:12px; color:{{textSecondary}}; margin-top:8px;">Remove</div>
      </div>

      <div style="text-align:center;">
        <div style="width:56px; height:56px; border-radius:14px; background:{{bgCard}}; border:1px solid {{border}}; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 2px rgba(0,0,0,0.04);">
          <svg viewBox="0 0 32 32" width="26" height="26" fill="none">
            <circle cx="14" cy="14" r="8" stroke="{{accent}}" stroke-width="2.4"/>
            <path d="M20 20 L26 26" stroke="{{accent}}" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
        </div>
        <div style="font-size:12px; color:{{textSecondary}}; margin-top:8px;">Search</div>
      </div>

      <div style="text-align:center;">
        <div style="width:56px; height:56px; border-radius:14px; background:{{bgCard}}; border:1px solid {{border}}; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 2px rgba(0,0,0,0.04);">
          <svg viewBox="0 0 32 32" width="26" height="26" fill="none">
            <path d="M8 12 A9 9 0 0 1 24 9" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M21 6 L24 9 L20.5 11.5" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M24 20 A9 9 0 0 1 8 23" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M11 26 L8 23 L11.5 20.5" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div style="font-size:12px; color:{{textSecondary}}; margin-top:8px;">Refresh</div>
      </div>

    </div>
  </div>

  <!-- SIDEBAR -->
  <div style="margin-bottom:52px; display:flex; gap:44px; flex-wrap:wrap;">
    <div style="flex:1; min-width:260px;">
      <div style="font-size:12px; letter-spacing:1.2px; text-transform:uppercase; color:{{textSecondary}}; font-weight:700; margin-bottom:16px;">Sidebar Categories</div>
      <div style="background:{{bgCard}}; border:1px solid {{border}}; border-radius:16px; padding:10px; max-width:260px;">

        <div style="display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:9px; background:{{accentSoft}};">
          <svg viewBox="0 0 32 32" width="26" height="26"><rect width="32" height="32" rx="7" fill="{{accent}}"/><polygon points="16,8 24,12.5 24,21.5 16,26 8,21.5 8,12.5" fill="white"/></svg>
          <span style="font-size:14px; font-weight:600;">Formulas</span>
        </div>

        <div style="display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:9px; margin-top:2px;">
          <svg viewBox="0 0 32 32" width="26" height="26"><rect width="32" height="32" rx="7" fill="{{accent}}"/><path d="M11 8 H21 C22 8 22.5 10 22.5 16 C22.5 22 22 24 21 24 H11 C10 24 9.5 22 9.5 16 C9.5 10 10 8 11 8 Z" fill="none" stroke="white" stroke-width="1.8"/><path d="M9.5 13 H22.5" stroke="white" stroke-width="1.4"/><path d="M9.5 19 H22.5" stroke="white" stroke-width="1.4"/></svg>
          <span style="font-size:14px; color:{{textPrimary}};">Casks</span>
        </div>

        <div style="display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:9px; margin-top:2px;">
          <svg viewBox="0 0 32 32" width="26" height="26"><rect width="32" height="32" rx="7" fill="{{accent}}"/><path d="M10 11 H22" stroke="white" stroke-width="2" stroke-linecap="round"/><path d="M16 11 V16" stroke="white" stroke-width="2" stroke-linecap="round"/><rect x="13" y="16" width="6" height="3.5" rx="1" fill="white"/><path d="M16 21 C13.5 23.5 13.5 27 16 27 C18.5 27 18.5 23.5 16 21 Z" fill="white"/></svg>
          <span style="font-size:14px; color:{{textPrimary}};">Taps</span>
        </div>

        <div style="display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:9px; margin-top:2px;">
          <svg viewBox="0 0 32 32" width="26" height="26"><rect width="32" height="32" rx="7" fill="{{accent}}"/><g fill="white"><circle cx="16" cy="16" r="4.4"/><rect x="14.5" y="4" width="3" height="5.5" rx="1"/><rect x="14.5" y="22.5" width="3" height="5.5" rx="1"/><rect x="14.5" y="4" width="3" height="5.5" rx="1" transform="rotate(60 16 16)"/><rect x="14.5" y="4" width="3" height="5.5" rx="1" transform="rotate(120 16 16)"/><rect x="14.5" y="4" width="3" height="5.5" rx="1" transform="rotate(180 16 16)"/><rect x="14.5" y="4" width="3" height="5.5" rx="1" transform="rotate(240 16 16)"/><rect x="14.5" y="4" width="3" height="5.5" rx="1" transform="rotate(300 16 16)"/></g><circle cx="16" cy="16" r="2" fill="{{accent}}"/></svg>
          <span style="font-size:14px; color:{{textPrimary}};">Services</span>
        </div>

      </div>
    </div>

    <!-- STATUS BADGES -->
    <div style="flex:1; min-width:280px;">
      <div style="font-size:12px; letter-spacing:1.2px; text-transform:uppercase; color:{{textSecondary}}; font-weight:700; margin-bottom:16px;">Status Badges</div>
      <div style="background:{{bgCard}}; border:1px solid {{border}}; border-radius:16px; padding:8px;">

        <div style="display:flex; align-items:center; justify-content:space-between; padding:10px 12px;">
          <span style="font-size:14px;">mead-core</span>
          <span style="display:flex; align-items:center; gap:6px; font-size:12px; color:{{textSecondary}};">
            <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="12" fill="{{green}}"/><path d="M6 12.5 L10 16.5 L18 8" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
            Installed
          </span>
        </div>
        <div style="height:1px; background:{{border}}; margin:0 12px;"></div>
        <div style="display:flex; align-items:center; justify-content:space-between; padding:10px 12px;">
          <span style="font-size:14px;">honeycomb-cli</span>
          <span style="display:flex; align-items:center; gap:6px; font-size:12px; color:{{textSecondary}};">
            <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="12" fill="{{accent}}"/><path d="M12 17 V7" stroke="white" stroke-width="2.4" stroke-linecap="round"/><path d="M7 12 L12 7 L17 12" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
            Outdated
          </span>
        </div>
        <div style="height:1px; background:{{border}}; margin:0 12px;"></div>
        <div style="display:flex; align-items:center; justify-content:space-between; padding:10px 12px;">
          <span style="font-size:14px;">stein-daemon</span>
          <span style="display:flex; align-items:center; gap:6px; font-size:12px; color:{{textSecondary}};">
            <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="12" fill="{{red}}"/><line x1="12" y1="6" x2="12" y2="14" stroke="white" stroke-width="2.6" stroke-linecap="round"/><circle cx="12" cy="18" r="1.4" fill="white"/></svg>
            Broken
          </span>
        </div>

      </div>
    </div>
  </div>

  <!-- PLACEHOLDER -->
  <div>
    <div style="font-size:12px; letter-spacing:1.2px; text-transform:uppercase; color:{{textSecondary}}; font-weight:700; margin-bottom:16px;">Package Placeholder</div>
    <div style="display:flex; align-items:center; gap:16px; background:{{bgCard}}; border:1px solid {{border}}; border-radius:16px; padding:20px 24px; max-width:340px;">
      <div style="width:56px; height:56px; border-radius:14px; background:{{bgCardAlt}}; border:1px solid {{border}}; display:flex; align-items:center; justify-content:center;">
        <svg viewBox="0 0 32 32" width="26" height="26" fill="none" stroke="{{textSecondary}}" stroke-width="1.8" stroke-linejoin="round">
          <path d="M16 4 L28 10 L28 22 L16 28 L4 22 L4 10 Z"/>
          <path d="M4 10 L16 16 L28 10"/>
          <path d="M16 16 V28"/>
        </svg>
      </div>
      <div>
        <div style="font-size:14px; font-weight:600;">Unknown package</div>
        <div style="font-size:12px; color:{{textSecondary}}; margin-top:2px;">Generic fallback icon</div>
      </div>
    </div>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;accentColor&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#D4A24C&quot;, &quot;options&quot;: [&quot;#D4A24C&quot;, &quot;#B8823A&quot;, &quot;#C98A3E&quot;, &quot;#E0AE5C&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Theme&quot;}}">
class Component extends DCLogic {
  state = { theme: 'light' };

  shade(color, percent) {
    const f = parseInt(color.slice(1), 16);
    const t = percent < 0 ? 0 : 255;
    const p = percent < 0 ? percent * -1 : percent;
    const R = f >> 16, G = (f >> 8) & 0x00FF, B = f & 0x0000FF;
    return '#' + (0x1000000 + (Math.round((t - R) * p) + R) * 0x10000 +
      (Math.round((t - G) * p) + G) * 0x100 +
      (Math.round((t - B) * p) + B)).toString(16).slice(1);
  }

  renderVals() {
    const accent = this.props.accentColor ?? '#D4A24C';
    const dark = this.state.theme === 'dark';
    return {
      accent,
      accentDark: this.shade(accent, -0.35),
      accentDarker: this.shade(accent, -0.55),
      accentSoft: dark ? this.shade(accent, -0.72) : this.shade(accent, 0.8),
      isDark: dark,
      bgPage: dark ? '#17130F' : '#F7F1E6',
      bgCard: dark ? '#211B15' : '#FFFFFF',
      bgCardAlt: dark ? '#2A2318' : '#FBF6EB',
      textPrimary: dark ? '#F3EADA' : '#241C13',
      textSecondary: dark ? '#AFA28A' : '#847A67',
      border: dark ? '#3A3126' : '#E9E0CE',
      lightBtnBg: dark ? 'transparent' : this.props.accentColor ?? '#D4A24C',
      lightBtnText: dark ? '#AFA28A' : '#FFFFFF',
      darkBtnBg: dark ? (this.props.accentColor ?? '#D4A24C') : 'transparent',
      darkBtnText: dark ? '#FFFFFF' : '#847A67',
      green: '#4E9B6E',
      red: '#C1503D',
      setLight: () => this.setState({ theme: 'light' }),
      setDark: () => this.setState({ theme: 'dark' }),
    };
  }
}
</script>
</body>
</html>
