name: PR Title Check

on:
  # Plain pull_request, not pull_request_target: release-please-action opens
  # its release PRs using the default GITHUB_TOKEN, and GitHub Actions never
  # fires pull_request_target for events authored by that token (loop
  # prevention). pull_request doesn't have that restriction -- it just needs
  # a bot-authored run to be manually approved once, same as CI already
  # requires.
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # We squash-merge, so the PR title becomes the commit message on
      # master -- release-please parses that history to decide the next
      # version and changelog entry, so it has to be a valid Conventional
      # Commit (feat:, fix:, feat!: / "BREAKING CHANGE:" for breaking
      # changes, docs:, chore:, refactor:, etc).
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
