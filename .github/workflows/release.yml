name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Maintains a standing "Release PR" that accumulates the version bump and
  # changelog computed from Conventional Commit-titled PRs merged since the
  # last release. Merging *that* PR is the deliberate "cut a release now"
  # action -- this job just keeps it up to date on every push to master.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Only runs when the step above just merged the Release PR (i.e. this
  # push to master *was* that merge) and actually cut a new tag + release.
  build-and-upload:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      # release-please's own version-suffix mechanism for prereleases requires
      # the manifest baseline to already carry a prerelease qualifier, which
      # doesn't fit release-as-you-go Conventional Commits versioning. Instead,
      # mark the release itself as a GitHub prerelease and prefix its title --
      # every release stays labeled pre-alpha until the project is stable,
      # independent of the numeric version.
      - name: Mark release as pre-alpha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ needs.release-please.outputs.tag_name }}" \
            --prerelease \
            --title "Pre-Alpha ${{ needs.release-please.outputs.tag_name }}"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build
        run: wails build

      - name: Zip app bundle
        working-directory: build/bin
        run: ditto -c -k --sequesterRsrc --keepParent mead.app "mead-${{ needs.release-please.outputs.tag_name }}-macos-arm64.zip"

      - name: Install create-dmg
        run: brew install create-dmg

      # create-dmg drives Finder over AppleScript to style the window, which
      # can hang instead of failing on some runner/permission quirks -- cap
      # it and don't let a styling hiccup block the release; the zip above
      # is always there as a fallback deliverable.
      - name: Build DMG installer
        working-directory: build/bin
        timeout-minutes: 5
        continue-on-error: true
        run: |
          create-dmg \
            --volname "mead" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "mead.app" 150 190 \
            --hide-extension "mead.app" \
            --app-drop-link 450 190 \
            "mead-${{ needs.release-please.outputs.tag_name }}-macos-arm64.dmg" \
            "mead.app"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            build/bin/*.zip build/bin/*.dmg --clobber

      - name: Add Gatekeeper / install notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ needs.release-please.outputs.tag_name }}" --json body -q .body > /tmp/notes.md
          cat >> /tmp/notes.md <<'EOF'

          ---

          **Unsigned build.** This isn't notarized with an Apple Developer ID,
          so Gatekeeper will refuse to open it with a normal double-click.
          After installing, either right-click `mead.app` → Open (and confirm
          once), or run:

          ```sh
          xattr -dr com.apple.quarantine /Applications/mead.app
          ```

          Requires [Homebrew](https://brew.sh) already installed. Apple Silicon
          (arm64) only.
          EOF
          gh release edit "${{ needs.release-please.outputs.tag_name }}" --notes-file /tmp/notes.md

  # Mirrors the DMG/zip to the public homebrew-mead repo (this repo is
  # private, so the tap needs its own copy of the assets to point at) and
  # bumps the cask's version + sha256 to match. Requires a fine-grained PAT
  # with contents:write on DaKiLloTh/homebrew-mead, stored as the
  # HOMEBREW_TAP_TOKEN secret -- the default github.token only has access to
  # this repo. Skips cleanly (rather than failing the release) if that
  # secret hasn't been set up yet.
  update-tap:
    needs: [release-please, build-and-upload]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: macos-14
    steps:
      - name: Check tap token is configured
        id: check
        run: |
          if [ -n "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::HOMEBREW_TAP_TOKEN secret is not set -- skipping tap mirror/update. See homebrew-mead's README for setup."
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.has_token == 'true'
        with:
          repository: DaKiLloTh/homebrew-mead
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Download release assets
        if: steps.check.outputs.has_token == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          gh release download "${{ needs.release-please.outputs.tag_name }}" \
            --repo ${{ github.repository }} \
            --pattern "*.dmg" --pattern "*.zip" \
            --dir assets

      - name: Mirror release to tap repo
        if: steps.check.outputs.has_token == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          gh release create "${{ needs.release-please.outputs.tag_name }}" \
            assets/*.dmg assets/*.zip \
            --repo DaKiLloTh/homebrew-mead \
            --prerelease \
            --title "Pre-Alpha ${{ needs.release-please.outputs.tag_name }}" \
            --notes "Mirrored release assets for the Homebrew tap. Full release notes: https://github.com/${{ github.repository }}/releases/tag/${{ needs.release-please.outputs.tag_name }}"

      - name: Update cask version and checksum
        if: steps.check.outputs.has_token == 'true'
        run: |
          VERSION="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${VERSION#v}"
          SHA256=$(shasum -a 256 assets/*.dmg | awk '{ print $1 }')

          cd tap
          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Casks/mead.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"${SHA256}\"/" Casks/mead.rb

          if git diff --quiet; then
            echo "No cask changes needed."
            exit 0
          fi

          git config user.name "mead-release-bot"
          git config user.email "actions@github.com"
          git add Casks/mead.rb
          git commit -m "chore: bump cask to ${VERSION}"
          git push
