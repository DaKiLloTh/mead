name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build
        run: wails build

      - name: Zip app bundle
        working-directory: build/bin
        run: ditto -c -k --sequesterRsrc --keepParent mead.app mead-${{ github.ref_name }}-macos-arm64.zip

      - name: Install create-dmg
        run: brew install create-dmg

      # create-dmg drives Finder over AppleScript to style the window, which
      # can hang instead of failing on some runner/permission quirks -- cap
      # it and don't let a styling hiccup block the release; the zip above
      # is always there as a fallback deliverable.
      - name: Build DMG installer
        working-directory: build/bin
        timeout-minutes: 5
        continue-on-error: true
        run: |
          create-dmg \
            --volname "mead" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "mead.app" 150 190 \
            --hide-extension "mead.app" \
            --app-drop-link 450 190 \
            "mead-${{ github.ref_name }}-macos-arm64.dmg" \
            "mead.app"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: 'Pre-Alpha ${{ github.ref_name }}'
          prerelease: true
          files: |
            build/bin/*.zip
            build/bin/*.dmg
          generate_release_notes: true
          body: |
            **Pre-alpha.** Expect rough edges and breaking changes between
            releases until this graduates out of pre-alpha.

            **Unsigned build.** This isn't notarized with an Apple Developer ID,
            so Gatekeeper will refuse to open it with a normal double-click.
            After installing, either right-click `mead.app` → Open (and confirm
            once), or run:

            ```sh
            xattr -dr com.apple.quarantine /Applications/mead.app
            ```

            Requires [Homebrew](https://brew.sh) already installed. Apple Silicon
            (arm64) only.
