name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build
        run: wails build

      - name: Zip app bundle
        working-directory: build/bin
        run: ditto -c -k --sequesterRsrc --keepParent mead.app mead-${{ github.ref_name }}-macos-arm64.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/mead-${{ github.ref_name }}-macos-arm64.zip
          generate_release_notes: true
          body: |
            **Unsigned build.** This isn't notarized with an Apple Developer ID, so
            Gatekeeper will refuse to open it with a normal double-click. After
            unzipping, either right-click `mead.app` → Open (and confirm once), or
            run:

            ```sh
            xattr -dr com.apple.quarantine mead.app
            ```

            Requires [Homebrew](https://brew.sh) already installed. Apple Silicon
            (arm64) only.
