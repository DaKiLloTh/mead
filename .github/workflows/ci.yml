name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# A new push to a PR supersedes the run in progress for it. Runs on master
# always finish, so every merge gets a complete result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # go.mod's `go` line is the source of truth. A hardcoded version here
      # had drifted behind it (1.25 vs 1.27), which made setup-go download a
      # second toolchain on every run.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal *.go)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted (run gofmt -w):"
            echo "$unformatted"
            exit 1
          fi

      # main.go does //go:embed all:frontend/dist, which fails to compile
      # (even just for `wails generate module`'s introspection of the App
      # struct) if that directory doesn't exist yet on a fresh checkout --
      # frontend/dist is gitignored since it's build output.
      - name: Seed frontend/dist placeholder
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      # Generates frontend/wailsjs (the Go<->TS bindings) that the frontend
      # imports from, and is a prerequisite for everything below: the
      # frontend typecheck needs the bindings to exist.
      - name: Generate Wails bindings
        run: wails generate module

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      # The same four checks as `npm run check`, split into steps so a
      # failure says which one. Format and lint come first because they are
      # the cheapest to fix.
      - name: Frontend format check
        working-directory: frontend
        run: npx prettier --check .

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend typecheck + build
        working-directory: frontend
        run: npm run build

      - name: Frontend tests with coverage
        working-directory: frontend
        run: |
          npm run coverage -- --coverage.reporter=text --coverage.reporter=text-summary | tee coverage.txt
          {
            echo '### Frontend coverage'
            echo '```'
            sed -n '/Coverage summary/,$p' coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Stories are the component tests' visual counterpart; a story that no
      # longer compiles or renders should fail the PR that broke it.
      - name: Storybook build
        working-directory: frontend
        run: npm run storybook:build

      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: go build ./...

      # -race matters here: the jobs package runs goroutines that share maps
      # behind a mutex.
      - name: Go test
        run: |
          go test -race -coverprofile=cover.out ./...
          {
            echo '### Go coverage'
            echo '```'
            go tool cover -func=cover.out | grep 'total:'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wails build
        run: wails build

  # Milestone 1 of issue #105: proves mead keeps compiling for Linux. A Wails
  # Linux build is cgo against GTK3 and webkit2gtk, so it needs a real Linux
  # runner. See docker/linux-build/ for the same build run locally. This job
  # does not launch the GUI.
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Same package list as docker/linux-build/Dockerfile.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Seed frontend/dist placeholder
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: Generate Wails bindings
        run: wails generate module

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      # Runs the Linux half of internal/platform's build-tagged tests.
      # ./internal/... only: cmd/mead-mon's tray icon needs
      # libayatana-appindicator and has no Linux port yet (deferred by
      # docs/cross-platform-architecture.md).
      - name: Go test
        run: go test -tags webkit2_41 ./internal/...

      # -tags webkit2_41: Wails v2.15.0 links webkit2gtk-4.0 by default, and
      # Ubuntu ships only the 4.1 pkg-config file.
      - name: Wails build (linux/amd64)
        run: wails build -platform linux/amd64 -tags webkit2_41

      - name: Confirm the binary is a Linux ELF executable
        run: |
          file build/bin/mead
          file build/bin/mead | grep -q 'ELF 64-bit LSB.*x86-64'
