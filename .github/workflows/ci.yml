name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck + build
        working-directory: frontend
        run: npm run build

      # go:embed'ing frontend/dist means the Go build/vet steps need it to
      # already exist -- they must run after the frontend is built.
      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: go build ./...

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Wails build
        run: wails build
